[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwhisperer"
version = "0.1.0"
requires-python = ">=3.12"  # neuralshed needs 3.12
dependencies = [
    "neuralset==0.4.0",
    # Not on PyPI: install the v0.1.0 tag of https://github.com/tetherto/neuralshed
    # (see README).
    "neuralshed==0.1.0",
    "torch>=2.13",
    "torchaudio>=2.11",
    "transformers>=5.10.4,<6",
    "peft>=0.20",
    "huggingface_hub>=1.33",
    "hydra-core>=1.3.7",
    "omegaconf>=2.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
train = ["lightning>=2.6.6", "torchmetrics>=1.9", "wandb>=0.28"]
viz = ["matplotlib>=3.9", "pillow>=13.0", "scikit-learn>=1.5", "manim>=0.18", "aquarel>=0.0.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainwhisperer*"]

# Ship the Whisper spelling map and the model card template with the package.
[tool.setuptools.package-data]
"brainwhisperer.utils" = ["english.json"]
"brainwhisperer.models" = ["model_card.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
