[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwhisperer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "neuralset==0.2.3",
    # Not on PyPI: install from a clone of https://github.com/tetherto/neuralshed
    # until it is pinned to a published commit.
    "neuralshed",
    "torch>=2.6",
    "torchaudio>=2.6",
    # Exact pin: newer versions change the grouped beam search the
    # generation config relies on.
    "transformers==4.44.2",
    "peft>=0.20",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
train = ["lightning>=2.6", "torchmetrics>=1.9", "wandb>=0.28"]
viz = ["matplotlib>=3.9", "pillow>=10.0", "scikit-learn>=1.5", "manim>=0.18", "aquarel>=0.0.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainwhisperer*"]

# Ship the Whisper spelling map with the package.
[tool.setuptools.package-data]
"brainwhisperer.utils" = ["english.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
