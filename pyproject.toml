[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwhisperer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "neuralset==0.2.3",
    # Not on PyPI: install from a local clone until it is pinned to a published commit.
    "tether-scratch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainwhisperer*"]

# Ship the Whisper spelling map with the package.
[tool.setuptools.package-data]
"brainwhisperer.utils" = ["english.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
