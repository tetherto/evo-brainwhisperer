[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwhisperer"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainwhisperer*"]

# Ship the Whisper spelling map with the package.
[tool.setuptools.package-data]
"brainwhisperer.utils" = ["english.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
