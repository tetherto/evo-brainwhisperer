# @package _global_
# Reproduces the hyperparameters of the original training runs
# (lightning_logs/version_3 through version_5 in evo-exp-brain-to-voice-online).
#
# Three settings differ from base.yaml and must be overridden here:
#
#   whisper_dropout: 0.1
#     Original set dropout / activation_dropout / attention_dropout = 0.1 on the
#     Whisper config before loading.  base.yaml keeps the pretrained default (0.0).
#
#   lora.target_modules: all six attention + FFN projections
#     Original applied LoRA to q, k, v, out, fc1, fc2.  base.yaml uses only q, v.
#
#   training.gradient_clip_val: 0
#     Original Trainer had no gradient_clip_val.  base.yaml clips at 1.0.

model:
  whisper_dropout: 0.1
  lora:
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - out_proj
      - fc1
      - fc2

training:
  gradient_clip_val: 0
