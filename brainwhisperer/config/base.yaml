defaults:
  - base_config
  - _self_

model:
  whisper_name: openai/whisper-tiny.en
  n_embedders: 1
  embedder:
    num_features: 512
    d_model: 384        # whisper-tiny.en encoder/decoder hidden size
    embed_type: conv
    kernel_size_1: 7
    stride_2: 2
    patch_size: 5
    encodings: sin
    day_projections: true
    day_proj_rank: 16
    dropout: 0.4
  encoder:
    n_layers: 6
    n_heads: 6
    d_model: 384
    d_ff: 1536
    dropout: 0.1
    last_phoneme_layer: 4
    attn_window_size: 29
    rope: false
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules:
      - q_proj
      - v_proj

data:
  datasets:
    - card
  batch_size: 32
  num_workers: 4
  max_seq_len: 448

training:
  max_epochs: 200
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-5
  gradient_clip_val: 1.0
  ce_coeff: 1.0
  ctc_phone_coeff: 1.0
  ctc_char_coeff: 0.0
  scheduler: cosine
  seed: 1

viz:
  enabled: false
  log_every_n_epochs: 5
