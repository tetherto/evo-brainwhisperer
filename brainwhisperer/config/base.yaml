defaults:
  - base_config
  - _self_

model:
  whisper_name: openai/whisper-small
  n_embedders: 1
  embedder:
    n_channels: 128
    patch_size: 16
    d_model: 384        # matches whisper-small encoder hidden size
    n_heads: 6
    dropout: 0.1
  encoder:
    n_layers: 6
    n_heads: 6
    d_model: 384
    d_ff: 1536
    dropout: 0.1
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules:
      - q_proj
      - v_proj

data:
  datasets:
    - nejm
  batch_size: 32
  num_workers: 4
  max_seq_len: 448

training:
  max_epochs: 100
  lr: 1.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 500
  gradient_clip_val: 1.0
  ctc_weight: 0.3
  seed: 42
